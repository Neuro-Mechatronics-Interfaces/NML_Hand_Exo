[project]
name = "nml_hand_exo"
version = "0.2.17"
description = "Python API for controlling the NML Hand Exoskeleton"
authors = [
    { name="Jonathan Shulgach", email="jshulgac@andrew.cmu.edu" },
    { name="Kriti Kacker", email="kkacker@andrew.cmu.edu" }, 
    { name="Coleman Walsh", email="colemanw@andrew.cmu.edu" },  
    { name="Max Murphy", email="mdmurphy@andrew.cmu.edu" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["exo", "neurotech", "biomedical", "rehabilitation"]
dependencies = [
    "numpy==1.26.4",
    "pyserial",
    "pyyaml",
    "PyQt5",
    "pyqtgraph==0.12.4",
    "pylsl",
    "pyxdf==1.16.8",
    "pandas",
    "scipy",
    "scikit-learn",
]

[project.urls]
Homepage = "https://github.com/Neuro-Mechatronics-Interfaces/NML_Hand_Exo"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["handexo_cli", "nml_task_cue_cli"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nml_hand_exo*"]

[tool.setuptools.package-data]
"nml_hand_exo.applications" = ["favicon-32x32.svg"]

[project.optional-dependencies]
ai = [
    "faster-whisper",
    "elevenlabs",
    "sounddevice",
]

docs = [
    "sphinx",
    "sphinx-autodoc-typehints",
    "myst-parser",
    "breathe",
    "sphinx-copybutton",
    "m2r2",
    "sphinx_rtd_theme",
]

[project.scripts]
nml-task-cue = "nml_task_cue_cli:main"
handexo = "handexo_cli:main"

[tool.pytest.ini_options]
testpaths = ["examples/tests", "tests"]
