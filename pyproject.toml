[project]
name = "nml_hand_exo"
version = "0.0.6"
description = "Python API for controlling the NML Hand Exoskeleton"
authors = [
    { name="Jonathan Shulgach", email="jshulgac@andrew.cmu.edu" },
    { name="Kriti Kacker", email="kkacker@andrew.cmu.edu" }, 
    { name="Coleman Walsh", email="colemanw@andrew.cmu.edu" },  
    { name="Max Murphy", email="mdmurphy@andrew.cmu.edu" }
]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["exo", "neurotech", "biomedical", "rehabilitation"]
dependencies = [
    "numpy",
    "pyserial",
    "pyyaml",
    "PyQt5",
    "pyqtgraph",
    "pylsl",
    "pandas",
    "scipy"
]

[project.urls]
Homepage = "https://github.com/Neuro-Mechatronics-Interfaces/NML_Hand_Exo"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["nml_hand_exo*"]

[project.optional-dependencies]
ai = [
    "faster-whisper",
    "elevenlabs",
    "sounddevice",
]

docs = [
    "sphinx",
    "sphinx-autodoc-typehints",
    "myst-parser",
    "breathe",
    "sphinx-copybutton",
    "m2r2",
    "sphinx_rtd_theme",
]

[project.scripts]
nml-exo-state-visualizer = "nml_hand_exo.applications.exo_state_visualizer:main"