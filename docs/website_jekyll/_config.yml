# Site Settings
title: NML Hand Exoskeleton
title_separator: "|"
subtitle: "Open-Source Research Platform"
name: "Neuromechatronics Lab"
description: "Open exoskeleton platform: software, hardware, and APIs for assistive robotics research"
url: "https://neuro-mechatronics-interfaces.github.io"
baseurl: "/NML_Hand_Exo"
repository: "Neuro-Mechatronics-Interfaces/NML_Hand_Exo"
logo: "/assets/images/logo.png"

# Theme Settings
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "exo"  # Using our custom skin

# Markdown & Syntax Highlighting
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-seo-tag

# Site Search
search: true
search_full_content: true
search_provider: lunr
lunr:
  search_within_pages: true

# SEO & Social
locale: "en-US"
og_image: /assets/images/hand-exo.jpg
social:
  type: Organization
  name: Neuromechatronics Lab
  links:
    - "https://github.com/Neuro-Mechatronics-Interfaces"

# Analytics (optional - uncomment when ready)
# analytics:
#   provider: "google-gtag"
#   google:
#     tracking_id: "G-XXXXXXXXXX"
#     anonymize_ip: false

# Site Author (for footer)
author:
  name: "Neuromechatronics Lab"
  avatar: "/assets/images/nml-splash-logo.png"
  bio: "Carnegie Mellon University"
  location: "Pittsburgh, PA"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Neuro-Mechatronics-Interfaces"
    - label: "Lab Website"
      icon: "fas fa-fw fa-link"
      url: "https://www.meche.engineering.cmu.edu/faculty/neuromechatronics-lab.html"

# Site Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Neuro-Mechatronics-Interfaces/NML_Hand_Exo"
    - label: "Documentation"
      icon: "fas fa-fw fa-book"
      url: "/docs/"
    - label: "License"
      icon: "fas fa-fw fa-file-contract"
      url: "https://github.com/Neuro-Mechatronics-Interfaces/NML_Hand_Exo/blob/main/LICENSE"

# Reading Files
include:
  - .htaccess
  - _pages
  - cpp_api_doxygen
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
      comments: false
      share: true
      related: true
      toc: true
      toc_sticky: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
  # all pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      toc: true
      toc_sticky: true

# Collections
collections:
  tutorials:
    output: true
    permalink: /:collection/:path/

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development

# Custom CSS/JS
head_scripts:
  - /assets/js/custom.js
after_footer_scripts:
  - /assets/js/custom.js
