<text text-anchor="middle" x="1568.48" y="-171.26" font-family="Arial" font-size="10.00">5. Independent current ceiling + plant</text>
<text text-anchor="middle" x="1568.48" y="-159.26" font-family="Arial" font-size="10.00">I_ceiling is a safety/compliance limit</text>
<text text-anchor="middle" x="1568.48" y="-147.26" font-family="Arial" font-size="10.00">tau_act = clamp(tau_PID, +/&#45; I_ceiling Kt)</text>
<text text-anchor="middle" x="1568.48" y="-123.26" font-family="Arial" font-size="10.00">plant: q,v &lt;&#45; tau_act + tau_ext</text>
<text text-anchor="middle" x="1568.48" y="-111.26" font-family="Arial" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;+ tau_endstop &#45; friction</text>
<text text-anchor="middle" x="1568.48" y="-87.26" font-family="Arial" font-size="10.00">feedback v measures progress;</text>
<text text-anchor="middle" x="1568.48" y="-75.26" font-family="Arial" font-size="10.00">stall releases lead and captures q_goal</text>
</g>
