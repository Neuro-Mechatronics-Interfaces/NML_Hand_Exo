<text text-anchor="middle" x="821.2" y="-276.26" font-family="Arial" font-size="10.00">3. Secondary goal state</text>
<text text-anchor="middle" x="821.2" y="-264.26" font-family="Arial" font-size="10.00">q_goal &lt;&#45; q_goal + dt * v_goal</text>
<text text-anchor="middle" x="821.2" y="-240.26" font-family="Arial" font-size="10.00">lead l is bounded and decays</text>
<text text-anchor="middle" x="821.2" y="-228.26" font-family="Arial" font-size="10.00">when progress stalls</text>
<text text-anchor="middle" x="821.2" y="-216.26" font-family="Arial" font-size="10.00">release: q_capture + 0.25 l</text>
<text text-anchor="middle" x="821.2" y="-204.26" font-family="Arial" font-size="10.00">opposite effort clears it;</text>
<text text-anchor="middle" x="821.2" y="-192.26" font-family="Arial" font-size="10.00">active reversal re&#45;anchors q</text>
<text text-anchor="middle" x="821.2" y="-180.26" font-family="Arial" font-size="10.00">and clears l before advancing</text>
<text text-anchor="middle" x="821.2" y="-168.26" font-family="Arial" font-size="10.00">qref = q_goal + sign(v_goal) * l</text>
<text text-anchor="middle" x="821.2" y="-144.26" font-family="Arial" font-size="10.00">Do not clamp qref to soft endstop</text>
</g>
