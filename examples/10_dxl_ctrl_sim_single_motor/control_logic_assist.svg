<text text-anchor="middle" x="1182.09" y="-279.26" font-family="Arial" font-size="10.00">4. Compliant position controller</text>
<text text-anchor="middle" x="1182.09" y="-267.26" font-family="Arial" font-size="10.00">e = qref &#45; q</text>
<text text-anchor="middle" x="1182.09" y="-243.26" font-family="Arial" font-size="10.00">low Kp, little/no Ki, damping D</text>
<text text-anchor="middle" x="1182.09" y="-231.26" font-family="Arial" font-size="10.00">tau_PID = Kp e + Ki integral(e)</text>
<text text-anchor="middle" x="1182.09" y="-219.26" font-family="Arial" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;+ Kd (vref &#45; v)</text>
