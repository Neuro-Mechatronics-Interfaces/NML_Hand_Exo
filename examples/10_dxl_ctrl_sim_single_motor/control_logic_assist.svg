<text text-anchor="middle" x="93.77" y="-80.26" font-family="Arial" font-size="10.00">1. Motor&#45;side sensing</text>
<text text-anchor="middle" x="93.77" y="-68.26" font-family="Arial" font-size="10.00">raw residual from q, v, acceleration,</text>
<text text-anchor="middle" x="93.77" y="-56.26" font-family="Arial" font-size="10.00">actuator torque, friction, endstop torque</text>
<text text-anchor="middle" x="93.77" y="-32.26" font-family="Arial" font-size="10.00">r_hat = LPF(residual)</text>
<text text-anchor="middle" x="93.77" y="-20.26" font-family="Arial" font-size="10.00">bias = running mean during collection</text>
<text text-anchor="middle" x="93.77" y="-8.26" font-family="Arial" font-size="10.00">r = r_hat &#45; bias</text>
</g>
