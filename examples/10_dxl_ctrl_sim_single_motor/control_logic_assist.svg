<text text-anchor="middle" x="1469.51" y="-171.26" font-family="Arial" font-size="10.00">5. Independent current ceiling + plant</text>
<text text-anchor="middle" x="1469.51" y="-159.26" font-family="Arial" font-size="10.00">I_ceiling is a safety/compliance limit</text>
<text text-anchor="middle" x="1469.51" y="-147.26" font-family="Arial" font-size="10.00">tau_act = clamp(tau_PID, +/&#45; I_ceiling Kt)</text>
<text text-anchor="middle" x="1469.51" y="-123.26" font-family="Arial" font-size="10.00">plant: q,v &lt;&#45; tau_act + tau_ext</text>
