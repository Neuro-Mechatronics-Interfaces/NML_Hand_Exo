<text text-anchor="middle" x="468.92" y="-162.26" font-family="Arial" font-size="10.00">2. Intent velocity</text>
<text text-anchor="middle" x="468.92" y="-150.26" font-family="Arial" font-size="10.00">filter signed residual r</text>
<text text-anchor="middle" x="468.92" y="-126.26" font-family="Arial" font-size="10.00">v_goal = gain * r</text>
<text text-anchor="middle" x="468.92" y="-102.26" font-family="Arial" font-size="10.00">activate after 30 ms intent;</text>
<text text-anchor="middle" x="468.92" y="-90.26" font-family="Arial" font-size="10.00">release after low residual or stalled progress;</text>
<text text-anchor="middle" x="468.92" y="-78.26" font-family="Arial" font-size="10.00">opposite effort re&#45;arms after release</text>
</g>
