<text text-anchor="middle" x="467.42" y="-150.26" font-family="Arial" font-size="10.00">2. Intent velocity</text>
<text text-anchor="middle" x="467.42" y="-138.26" font-family="Arial" font-size="10.00">filter signed residual r</text>
<text text-anchor="middle" x="467.42" y="-114.26" font-family="Arial" font-size="10.00">v_goal = gain * r</text>
<text text-anchor="middle" x="467.42" y="-90.26" font-family="Arial" font-size="10.00">activate after sustained bias;</text>
<text text-anchor="middle" x="467.42" y="-78.26" font-family="Arial" font-size="10.00">release after low residual or stalled progress</text>
</g>
