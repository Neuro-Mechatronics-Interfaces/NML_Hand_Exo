name: Build and Deploy Jekyll Docs

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'
        bundler-cache: false

    - name: Install Jekyll dependencies
      working-directory: docs/website_jekyll
      run: |
        gem install bundler
        bundle install

    - name: Install Doxygen
      run: sudo apt-get update && sudo apt-get install -y doxygen

    - name: Create Doxygen output directory
      run: mkdir -p docs/build/doxygen

    - name: Run Doxygen
      working-directory: docs
      run: doxygen Doxyfile

    - name: Copy Doxygen output to Jekyll
      run: |
        mkdir -p docs/website_jekyll/cpp_api_doxygen
        cp -r docs/build/doxygen/html/* docs/website_jekyll/cpp_api_doxygen/

    - name: Build Jekyll site
      working-directory: docs/website_jekyll
      run: bundle exec jekyll build

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/website_jekyll/_site
        publish_branch: gh-pages