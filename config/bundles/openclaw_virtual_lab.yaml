bundle_version: 1
bundle_id: openclaw_virtual_lab
description: Virtual OpenClaw lab bundle for cross-robot development and testing.
adapter:
  id: virtual_openclaw
  config: ../robot_adapters/virtual_openclaw.yaml
signature:
  required: false
policy_profile: ../policy_profiles/rapid_iteration.yaml
skill_packs:
  - ../skill_packs/openclaw_lab.md
telemetry:
  schema_version: v1
  strict: true
runtime_defaults:
  provider: heuristic
  provider_fallback: heuristic
  assistant_tone: neutral
  confirmation_mode: balanced
  dry_run: true
  telemetry_broadcast: true
tags:
  - openclaw
  - virtual
  - cross-robot
