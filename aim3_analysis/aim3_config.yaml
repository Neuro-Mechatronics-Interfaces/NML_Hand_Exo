# Aim 3 EMG-to-Exo analysis defaults

figure:
  dpi: 300
  width_in: 13.333
  height_in: 7.5
  font_size: 14

control:
  equation: "I_cmd(t) = G * I_max * u(t)"
  effort_min: -1.0
  effort_max: 1.0
  close_positive: true
  default_deadband: 0.05
  preliminary_i_max_ma: 200.0
  current_limit_ma: 910.0
  active_motor_ids: [16, 17, 18]

columns:
  time:
    - time_s
    - timestamp_s
    - timestamp
    - lsl_timestamp_s
    - timestamp_lsl_user_intent
    - timestamp_control_update_monotonic_ns
    - timestamp_control_update_wall_ns
  label:
    - label
    - class
    - gesture
    - trial_label
    - condition
  split:
    - split
    - set
    - train_test
  effort:
    - signed_effort_u_deadbanded
    - signed_effort_u_clipped
    - mapped_intent
    - smoothed_intent
    - raw_intent
    - User_Intent
    - user_intent
  projection:
    - LDA_projection_z
    - lda_projection_z
    - z_filtered
    - projection
  current_command:
    - commanded_current_mA
    - command_current_ma
    - I_cmd_mA
  motor_id:
    - motor_id
    - dxl_id
  motor_position:
    - position
    - present_position_ticks
    - position_ticks
  measured_current:
    - measured_current_mA
    - motor_current_ma
    - present_current_mA
